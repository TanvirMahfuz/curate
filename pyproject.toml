[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curate"
version = "1.0.0"
description = "A command-line tool to organize files"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
curate = "file_organizer.cli:main"

[tool.setuptools]
packages = ["file_organizer"]
